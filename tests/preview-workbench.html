<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Prévia de teste — telas</title><style>body{margin:0;background:#091522;color:#a8f1ff;font:12px monospace}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{padding:6px}iframe{border:0;width:100%;height:calc(100dvh - 74px);display:block}</style><header>PRÉVIA DE TESTE · NÃO É UMA PARTIDA<button data-view="configuration">Configuração</button><button data-view="skills">Melhorias</button><button data-view="boss">HUD do chefe</button></header><iframe id="preview" src="../index.html" title="Telas reais em cenário de teste"></iframe><script>
const frame=document.getElementById('preview');function showPreview(view){const g=frame.contentWindow;g.openGarage();if(view==='configuration'){g.openRunConfig();return;}g.reset();if(view==='skills'){g.upgrade();return;}g.spawnBoss();g.updateHUD();g.pause();g.document.getElementById('overlay').hidden=true;}frame.onload=()=>showPreview('skills');for(const b of document.querySelectorAll('button'))b.onclick=()=>showPreview(b.dataset.view);
</script></html>
