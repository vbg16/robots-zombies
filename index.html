<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screwvivors — protótipo</title>
<link rel="stylesheet" href="style.css">
<body class="combat-screen">
<main>
<section class="arena"><canvas id="game" aria-label="Arena de sobrevivência: mova o robô com WASD ou setas; mire com o mouse e segure o botão esquerdo para atirar"></canvas><div class="hud" aria-label="Informações de combate"><div><small>INTEGRIDADE</small><div id="health" class="batteries" role="meter" aria-label="Integridade do robô" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div></div><div><small>TEMPO</small><b id="time">00:00</b></div><div><small>ELIMINAÇÕES</small><b id="kills">0</b></div><div><small>NÍVEL</small><b id="level">01</b></div><button id="pause" type="button" aria-label="Pausar ou continuar partida">PAUSAR [P]</button></div><div id="overlay" class="overlay"><p id="eyebrow">UNIDADE R-01 / AGUARDANDO</p><h2 id="heading">O caos não espera.</h2><p id="description">Colete energia, evolua seu arsenal e sobreviva por 3 minutos.<br>Mova com WASD ou setas. Mire com o mouse e segure o botão esquerdo para atirar.</p><div id="choices"></div><button id="start" class="primary">INICIAR PROTOCOLO ↗</button></div><div class="xp"><i id="xp"></i></div></section>
</main><script src="game.js"></script>
</body></html>
